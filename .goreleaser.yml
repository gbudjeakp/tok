version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tok
    main: .
    binary: tok
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/gbudjeakp/tok/cmd.Version={{.Version}}

archives:
  - id: tok
    name_template: "tok_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: gbudjeakp
    name: tok
  draft: false
  prerelease: auto
